<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioFusion — Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #0f172a; text-align: center; padding: 2rem; }
    .card { max-width: 22rem; }
    .badge { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 1.2rem;
      background: #0066CC; color: #fff; display: grid; place-items: center; font-size: 2rem;
      box-shadow: 0 12px 30px rgba(37,99,235,0.25); }
    h1 { font-size: 1.4rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { color: #475569; line-height: 1.6; }
    button { margin-top: 1.2rem; padding: 0.7rem 1.4rem; border: 0; border-radius: 10px;
      background: #0066CC; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🫁</div>
    <h1>You're offline</h1>
    <p>BioFusion needs an internet connection to screen an X-ray. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
